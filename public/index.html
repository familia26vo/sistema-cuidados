<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Care Stock — Gestão de Cuidados</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--brand:#2563eb;--brand2:#1d4ed8;--danger:#dc2626;--ok:#15803d;--line:#e2e8f0;--shadow:0 10px 30px #17203312}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:700}button:hover{background:var(--brand2)}button.secondary{background:#e8eef9;color:#1e40af}button.danger{background:#fee2e2;color:#991b1b}button.ghost{background:transparent;color:var(--brand)}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#dbeafe,#f8fafc)}.login-card{background:var(--card);width:min(430px,100%);padding:34px;border-radius:20px;box-shadow:var(--shadow)}.brand{font-size:28px;font-weight:850;color:var(--brand);margin:0 0 8px}.muted{color:var(--muted)}.error{color:var(--danger);font-size:14px;margin:10px 0}.shell{min-height:100vh}.topbar{background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:15px 5%;gap:20px}.topbar strong{font-size:20px}.topbar small{color:#cbd5e1}.layout{display:flex;max-width:1500px;margin:auto}.sidebar{width:235px;background:#fff;min-height:calc(100vh - 62px);padding:20px 14px;border-right:1px solid var(--line)}.nav{width:100%;background:transparent;color:#475569;text-align:left;margin:3px 0}.nav.active,.nav:hover{background:#dbeafe;color:#1d4ed8}.content{flex:1;padding:28px;min-width:0}.page-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.page-title h1{margin:0;font-size:26px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:var(--shadow)}.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi strong{font-size:27px;display:block;margin-top:5px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.low{background:#fff1f2}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}.badge.danger{background:#fee2e2;color:#b91c1c}.badge.ok{background:#dcfce7;color:#166534}.badge.blue{background:#dbeafe;color:#1d4ed8}.chart-box{height:310px}.purchase-row{border-top:1px solid var(--line);padding:12px 0}.purchase-row:first-child{border-top:0}.receipt{font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:#0f172a;color:#fff;border-radius:10px;padding:13px 16px;max-width:360px;box-shadow:var(--shadow);z-index:5}.modal{position:fixed;inset:0;background:#0f172a80;display:grid;place-items:center;padding:20px;z-index:4}.modal-card{background:#fff;border-radius:15px;padding:22px;width:min(700px,100%);max-height:90vh;overflow:auto}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{margin:0;font-size:18px}@media(max-width:900px){.sidebar{width:190px}.kpis{grid-template-columns:repeat(2,1fr)}.span-8,.span-6,.span-4{grid-column:span 12}}@media(max-width:650px){.layout{display:block}.sidebar{width:100%;min-height:auto;display:flex;overflow:auto;gap:5px}.nav{white-space:nowrap;width:auto}.content{padding:16px}.form-grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.topbar{padding:12px 16px}}
  </style>
</head>
<body>
  <section id="loginView" class="login"><div class="login-card"><p class="brand">Care Stock</p><p class="muted">Gestão segura de cuidados, estoque e compras.</p><form id="loginForm"><div class="field"><label>Login ou e-mail</label><input id="loginEmail" type="text" required autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Senha</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button style="width:100%;margin-top:18px">Entrar</button><p id="loginError" class="error"></p></form></div></section>
  <section id="appView" class="shell hidden"><header class="topbar"><strong>Care Stock</strong><span><small id="userInfo"></small> <button class="secondary" id="logoutBtn">Sair</button></span></header><div class="layout"><aside class="sidebar"><button class="nav active" data-page="dashboard">Visão geral</button><button class="nav" data-page="stock">Estoque</button><button class="nav" data-page="purchases">Compras e comprovantes</button><button class="nav" data-page="charts">Gráficos e relatórios</button><button class="nav admin-only" data-page="users">Usuários</button></aside><main class="content"><div id="page-dashboard" class="page"></div><div id="page-stock" class="page hidden"></div><div id="page-purchases" class="page hidden"></div><div id="page-charts" class="page hidden"></div><div id="page-users" class="page hidden"></div></main></div></section><div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden"></div>
<script>
const state={token:localStorage.getItem('care_token'),user:null,stock:[],purchases:[],charts:{}};const $=s=>document.querySelector(s);const api=async(url,opt={})=>{opt.headers={...(opt.headers||{}),Authorization:`Bearer ${state.token}`};if(opt.body&&!(opt.body instanceof FormData)) {opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);if(r.status===204)return null;const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Erro na operação');return data};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3500)};const admin=()=>state.user?.role==='admin';
function showPage(page){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(`#page-${page}`).classList.remove('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(page==='dashboard')renderDashboard();if(page==='stock')renderStock();if(page==='purchases')renderPurchases();if(page==='charts')renderCharts();if(page==='users')renderUsers()}
async function start(){if(!state.token)return $('#loginView').classList.remove('hidden');try{state.user=await api('/api/me');$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userInfo').textContent=`${state.user.name} · ${state.user.role==='admin'?'Administrador':'Familiar (leitura)'}`;document.querySelectorAll('.admin-only').forEach(x=>x.classList.toggle('hidden',!admin()));await refresh();showPage('dashboard')}catch(e){localStorage.removeItem('care_token');state.token=null;$('#loginView').classList.remove('hidden')}}
async function refresh(){state.stock=await api('/api/stock');state.purchases=await api('/api/purchases')}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{const d=await api('/api/auth/login',{method:'POST',body:{email:$('#loginEmail').value,password:$('#loginPassword').value}});state.token=d.token;localStorage.setItem('care_token',d.token);await start()}catch(err){$('#loginError').textContent=err.message}};$('#logoutBtn').onclick=()=>{localStorage.removeItem('care_token');location.reload()};document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>showPage(n.dataset.page));
function renderDashboard(){const low=state.stock.filter(x=>x.low_stock);const total=state.purchases.reduce((a,x)=>a+Number(x.total_amount),0);$('#page-dashboard').innerHTML=`<div class="page-title"><div><h1>Visão geral</h1><p class="muted">Acompanhamento rápido dos cuidados do avô.</p></div>${admin()?'<button onclick="openStockModal()">+ Novo item</button>':''}</div><div class="kpis"><div class="card kpi"><span class="muted">Itens ativos</span><strong>${state.stock.length}</strong></div><div class="card kpi"><span class="muted">Estoque crítico</span><strong style="color:var(--danger)">${low.length}</strong></div><div class="card kpi"><span class="muted">Compras registradas</span><strong>${state.purchases.length}</strong></div><div class="card kpi"><span class="muted">Total comprado</span><strong>${money(total)}</strong></div></div><div class="grid" style="margin-top:18px"><div class="card span-8"><div class="section-title"><h2>Alertas de estoque</h2><button class="secondary" onclick="showPage('stock')">Ver estoque</button></div>${low.length?low.map(x=>`<div class="purchase-row"><b>${esc(x.name)}</b> <span class="badge danger">Comprar urgente</span><br><span class="muted">Saldo: ${x.current_stock} ${esc(x.unit_label)} · limite: ${x.critical_limit} · previsão: ${x.estimated_purchase_date||'sem estimativa'}</span></div>`).join(''):'<p class="muted">Nenhum item abaixo do limite crítico.</p>'}</div><div class="card span-4"><h2 style="font-size:18px">Acesso</h2><p class="muted">${admin()?'Você possui permissão total para gerenciar o sistema.':'Sua conta possui acesso somente para leitura. Consulte o administrador para alterações.'}</p><button class="secondary" onclick="showPage('charts')">Abrir relatórios</button></div></div>`}
function renderStock(){const rows=state.stock.map(x=>`<tr class="${x.low_stock?'low':''}"><td><b>${esc(x.name)}</b><br><small class="muted">${esc(x.category)} · ${esc(x.specification_type)} ${x.specification_value?esc(x.specification_value):''}</small></td><td>${x.current_stock} ${esc(x.unit_label)}<br>${x.low_stock?'<span class="badge danger">Comprar urgente</span>':'<span class="badge ok">Normal</span>'}</td><td>${x.critical_limit}</td><td>${x.average_daily_consumption||'—'}<br><small>${x.estimated_purchase_date||'sem previsão'}</small></td><td>${admin()?`<button class="secondary" onclick="openMovementModal('${x.id}')">Movimentar</button> <button class="ghost" onclick="openStockModal('${x.id}')">Editar</button>`:'Somente leitura'}</td></tr>`).join('');$('#page-stock').innerHTML=`<div class="page-title"><div><h1>Estoque</h1><p class="muted">Medicamentos, fraldas e demais insumos.</p></div>${admin()?'<button onclick="openStockModal()">+ Cadastrar item</button>':''}</div><div class="card table-wrap"><table><thead><tr><th>Item</th><th>Saldo</th><th>Limite crítico</th><th>Consumo / previsão</th><th>Ações</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Nenhum item cadastrado.</td></tr>'}</tbody></table></div>`}
function renderPurchases(){const rows=state.purchases.map(p=>`<div class="purchase-row"><b>${new Date(p.purchased_at+'T12:00:00').toLocaleDateString('pt-BR')} · ${esc(p.supplier||'Compra')}</b><span style="float:right"><b>${money(p.total_amount)}</b></span><br><small class="muted">Por ${esc(p.created_by)} · ${p.items.map(i=>`${esc(i.item_name)} (${i.quantity})`).join(', ')}</small>${p.attachments?.length?`<div class="receipt">${p.attachments.map(a=>`<a href="/api/attachments/${a.id}" target="_blank" onclick="return authDownload(event,'${a.id}')">Baixar comprovante: ${esc(a.original_name)}</a>`).join(' · ')}</div>`:''}</div>`).join('');$('#page-purchases').innerHTML=`<div class="page-title"><div><h1>Compras e comprovantes</h1><p class="muted">Histórico compartilhado com a família.</p></div>${admin()?'<button onclick="openPurchaseModal()">+ Registrar compra</button>':''}</div><div class="card">${rows||'<p class="muted">Nenhuma compra registrada.</p>'}</div>`}
async function authDownload(e,id){e.preventDefault();const r=await fetch('/api/attachments/'+id,{headers:{Authorization:'Bearer '+state.token}});if(!r.ok)return toast('Não foi possível baixar o comprovante.');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='comprovante';a.click();URL.revokeObjectURL(a.href);return false}
async function renderCharts(){const d=await api('/api/dashboard');$('#page-charts').innerHTML=`<div class="page-title"><div><h1>Gráficos e relatórios</h1><p class="muted">Dados dos últimos 30 dias.</p></div><button onclick="whatsappReport()">Gerar Relatório de Gastos/Compras</button></div><div class="grid"><div class="card span-6"><h2 style="font-size:18px">Consumo por item</h2><div class="chart-box"><canvas id="consumptionChart"></canvas></div></div><div class="card span-6"><h2 style="font-size:18px">Gastos por dia</h2><div class="chart-box"><canvas id="spendingChart"></canvas></div></div><div class="card span-12"><h2 style="font-size:18px">Evolução líquida do estoque</h2><div class="chart-box"><canvas id="evolutionChart"></canvas></div></div></div>`;Object.values(state.charts).forEach(c=>c?.destroy());state.charts.consumption=new Chart($('#consumptionChart'),{type:'bar',data:{labels:d.consumption.map(x=>x.name),datasets:[{label:'Consumo',data:d.consumption.map(x=>x.consumed),backgroundColor:'#2563eb'}]},options:{responsive:true,maintainAspectRatio:false}});state.charts.spending=new Chart($('#spendingChart'),{type:'line',data:{labels:d.spending.map(x=>x.date),datasets:[{label:'R$',data:d.spending.map(x=>x.total),borderColor:'#16a34a',backgroundColor:'#bbf7d0',fill:true}]},options:{responsive:true,maintainAspectRatio:false}});state.charts.evolution=new Chart($('#evolutionChart'),{type:'line',data:{labels:d.evolution.map(x=>x.date),datasets:[{label:'Variação líquida',data:d.evolution.map(x=>x.net_change),borderColor:'#7c3aed'}]},options:{responsive:true,maintainAspectRatio:false}})}
async function renderUsers(){if(!admin())return;const users=await api('/api/users');$('#page-users').innerHTML=`<div class="page-title"><div><h1>Usuários</h1><p class="muted">Cadastre familiares com acesso individual de leitura.</p></div><button onclick="openUserModal()">+ Novo usuário</button></div><div class="card table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th></th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><span class="badge ${u.role==='admin'?'blue':'ok'}">${u.role}</span></td><td>${u.active?'Ativo':'Inativo'}</td><td><button class="secondary" onclick="toggleUser('${u.id}')">${u.active?'Desativar':'Ativar'}</button></td></tr>`).join('')}</tbody></table></div><div class="card" style="margin-top:18px"><div class="section-title"><h2>Backup e restauração manual</h2></div><p class="muted">Exporte os dados para um arquivo JSON e guarde também a pasta <b>uploads/</b>, que contém os comprovantes.</p><div class="actions"><button onclick="downloadBackup()">Baixar backup JSON</button><label><input id="restoreFile" type="file" accept="application/json,.json" hidden onchange="restoreBackup(this)"><button type="button" class="secondary" onclick="$('#restoreFile').click()">Restaurar backup JSON</button></label></div><small class="muted">A restauração substitui os dados atuais. Faça um backup antes de restaurar.</small></div>`}
function modal(html){$('#modal').innerHTML=`<div class="modal-card">${html}</div>`;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function openStockModal(id){const x=state.stock.find(i=>i.id===id)||{};modal(`<div class="section-title"><h2>${id?'Editar':'Cadastrar'} item</h2><button class="ghost" onclick="closeModal()">Fechar</button></div><form id="stockForm"><div class="form-grid"><div class="field"><label>Nome *</label><input name="name" value="${esc(x.name)}" required></div><div class="field"><label>Categoria</label><input name="category" value="${esc(x.category||'medicamento')}" placeholder="medicamento, fralda..."></div><div class="field"><label>Especificação *</label><select name="specification_type"><option value="liquid" ${x.specification_type==='liquid'?'selected':''}>Líquido (ml)</option><option value="tablet" ${x.specification_type==='tablet'?'selected':''}>Comprimido/Cápsula (mg)</option><option value="unit" ${x.specification_type==='unit'?'selected':''}>Unidades</option></select></div><div class="field"><label>Valor da especificação</label><input name="specification_value" type="number" step="0.01" value="${x.specification_value||''}" placeholder="Ex.: 500"></div><div class="field"><label>Unidade do estoque</label><input name="unit_label" value="${esc(x.unit_label||'unidade')}" placeholder="ml, mg, unidade"></div>${id?'':'<div class="field"><label>Estoque inicial</label><input name="current_stock" type="number" step="0.01" value="0"></div>'}<div class="field"><label>Limite crítico</label><input name="critical_limit" type="number" step="0.01" value="${x.critical_limit??5}"></div><div class="field"><label>Consumo médio diário</label><input name="average_daily_consumption" type="number" step="0.01" value="${x.average_daily_consumption??0}"></div><div class="field full"><label>Observações</label><textarea name="notes">${esc(x.notes)}</textarea></div></div><div class="actions"><button>Salvar</button>${id?`<button type="button" class="danger" onclick="deleteStock('${id}')">Excluir</button>`:''}</div></form>`);$('#stockForm').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));try{await api(id?'/api/stock/'+id:'/api/stock',{method:id?'PUT':'POST',body});closeModal();await refresh();showPage('stock');toast('Item salvo com sucesso.')}catch(err){toast(err.message)}}}
function openMovementModal(id){const x=state.stock.find(i=>i.id===id);modal(`<div class="section-title"><h2>Movimentar: ${esc(x.name)}</h2><button class="ghost" onclick="closeModal()">Fechar</button></div><form id="movementForm"><div class="form-grid"><div class="field"><label>Tipo</label><select name="movement_type"><option value="consumption">Consumo / saída</option><option value="entry">Entrada</option><option value="adjustment">Ajuste positivo</option></select></div><div class="field"><label>Quantidade</label><input name="quantity" type="number" min="0.01" step="0.01" required></div><div class="field full"><label>Motivo</label><input name="reason" placeholder="Ex.: dose administrada"></div></div><div class="actions"><button>Registrar</button></div></form>`);$('#movementForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/stock/'+id+'/movement',{method:'POST',body:Object.fromEntries(new FormData(e.target))});closeModal();await refresh();showPage('stock');toast('Movimentação registrada.')}catch(err){toast(err.message)}}}
function openPurchaseModal(){modal(`<div class="section-title"><h2>Registrar compra</h2><button class="ghost" onclick="closeModal()">Fechar</button></div><form id="purchaseForm"><div class="form-grid"><div class="field"><label>Fornecedor</label><input name="supplier"></div><div class="field"><label>Data</label><input name="purchased_at" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>Item</label><select id="purchaseItem">${state.stock.map(x=>`<option value="${x.id}" data-name="${esc(x.name)}">${esc(x.name)} (${x.unit_label})</option>`).join('')}</select></div><div class="field"><label>Quantidade</label><input id="purchaseQty" type="number" step="0.01" min="0.01" value="1"></div><div class="field"><label>Preço unitário</label><input id="purchasePrice" type="number" step="0.01" min="0" value="0"></div><div class="field full"><label>Comprovante (PDF ou imagem, máx. 10 MB)</label><input name="receipt" type="file" accept="application/pdf,image/jpeg,image/png,image/webp"></div><div class="field full"><label>Observações</label><textarea name="notes"></textarea></div></div><div class="actions"><button>Registrar compra</button></div></form>`);$('#purchaseForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target), select=$('#purchaseItem'), opt=select.options[select.selectedIndex];fd.append('items',JSON.stringify([{item_id:select.value,item_name:opt.dataset.name,quantity:$('#purchaseQty').value,unit_price:$('#purchasePrice').value}]));try{await api('/api/purchases',{method:'POST',body:fd});closeModal();await refresh();showPage('purchases');toast('Compra e comprovante registrados.')}catch(err){toast(err.message)}}}
function openUserModal(){modal(`<div class="section-title"><h2>Novo usuário</h2><button class="ghost" onclick="closeModal()">Fechar</button></div><form id="userForm"><div class="form-grid"><div class="field"><label>Nome *</label><input name="name" required></div><div class="field"><label>E-mail *</label><input name="email" type="email" required></div><div class="field"><label>Senha provisória *</label><input name="password" type="password" minlength="8" required></div><div class="field"><label>Perfil</label><select name="role"><option value="viewer">Familiar — leitura</option><option value="admin">Administrador</option></select></div></div><div class="actions"><button>Criar usuário</button></div></form></div>`);$('#userForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/users',{method:'POST',body:Object.fromEntries(new FormData(e.target))});closeModal();showPage('users');toast('Usuário criado.')}catch(err){toast(err.message)}}}
async function deleteStock(id){if(!confirm('Excluir este item do estoque? O histórico será preservado.'))return;try{await api('/api/stock/'+id,{method:'DELETE'});closeModal();await refresh();showPage('stock');toast('Item excluído.')}catch(e){toast(e.message)}}async function toggleUser(id){try{await api('/api/users/'+id+'/status',{method:'PATCH'});renderUsers();toast('Status atualizado.')}catch(e){toast(e.message)}}async function downloadBackup(){try{const r=await fetch('/api/admin/backup',{headers:{Authorization:'Bearer '+state.token}});if(!r.ok)throw Error('Não foi possível gerar o backup.');const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='care-stock-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup baixado.')}catch(e){toast(e.message)}}async function restoreBackup(input){const file=input.files[0];if(!file)return;if(!confirm('A restauração substituirá os dados atuais. Deseja continuar?'))return;try{const backup=JSON.parse(await file.text());await api('/api/admin/restore',{method:'POST',body:backup});await refresh();showPage('dashboard');toast('Backup restaurado com sucesso.')}catch(e){toast(e.message)}finally{input.value=''}}async function whatsappReport(){try{const d=await api('/api/report/today');window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(d.text),'_blank')}catch(e){toast(e.message)}}
start();
</script></body></html>
